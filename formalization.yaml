  "fidelity": {
    "divergences": "The continuum is the ambient type X. For a continuum C inside a larger space, instantiate X with subtype C and its induced topology. No metric, local connectedness, or nondegeneracy assumption is used for the characterizations. Mathlib IsConnected includes nonemptiness. The preconnected point-removal theorem permits the empty complement of a singleton; the connected version adds Nontrivial X. Both project predicates have complete identical bodies in Challenge and Solution."
