  "project": {
    "name": "Interior Characterization of Indecomposable Continua",
    "description": "A compact connected Hausdorff space is indecomposable if and only if every proper nonempty compact connected subset has empty interior in that space, equivalently is nowhere dense. Removing a proper subcontinuum leaves a connected nonempty set. Every point has preconnected complement; for a nontrivial continuum the point complement is also nonempty. Singleton continua are included.",
